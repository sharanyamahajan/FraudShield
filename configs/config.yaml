# FraudShield Configuration
project_name: "FraudShield"
seed: 42

paths:
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  models_dir: "models"
  reports_dir: "reports"
  sqlite_db: "reports/fraudshield.db"

data:
  raw_transactions: "train_transaction.csv"
  raw_identity: "train_identity.csv"
  joined_parquet: "data/interim/joined_transactions.parquet"
  target_col: "isFraud"
  time_col: "TransactionDT"
  id_col: "TransactionID"

splits:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  backtest_folds: 4

features:
  proxy_entity_col: "card1"
  proxy_entity_composite: ["card1", "addr1"]
  windows_seconds:
    h1: 3600
    h24: 86400
    d7: 604800

models:
  logistic_regression:
    max_iter: 1000
    c_param: 1.0
  isolation_forest:
    n_estimators: 100
    contamination: 0.035
  xgboost:
    n_estimators: 500
    early_stopping_rounds: 30
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8

evaluation:
  review_budgets: [0.005, 0.01, 0.02, 0.05] # top 0.5%, 1%, 2%, 5%
  threshold_sweep:
    start: 0.05
    stop: 0.95
    step: 0.05
  bootstrap_replicates: 1000
  cost_model:
    review_cost_fixed: 15.0 # USD per alert reviewed
    cost_sweep_range: [5.0, 10.0, 15.0, 20.0, 30.0, 50.0]

api:
  host: "127.0.0.1"
  port: 8000
